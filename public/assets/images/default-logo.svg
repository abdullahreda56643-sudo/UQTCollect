<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#grad1)" stroke="#1e3a8a" stroke-width="2"/>
  
  <!-- Building/Education icon -->
  <g fill="white">
    <!-- Main building structure -->
    <rect x="18" y="20" width="28" height="24" rx="2"/>
    
    <!-- Roof -->
    <polygon points="16,20 32,10 48,20" fill="#fbbf24"/>
    
    <!-- Windows -->
    <rect x="22" y="24" width="4" height="4" fill="#1e293b"/>
    <rect x="30" y="24" width="4" height="4" fill="#1e293b"/>
    <rect x="38" y="24" width="4" height="4" fill="#1e293b"/>
    
    <rect x="22" y="32" width="4" height="4" fill="#1e293b"/>
    <rect x="30" y="32" width="4" height="4" fill="#1e293b"/>
    <rect x="38" y="32" width="4" height="4" fill="#1e293b"/>
    
    <!-- Door -->
    <rect x="28" y="38" width="8" height="6" fill="#1e293b"/>
    
    <!-- Graduation cap on top -->
    <ellipse cx="32" cy="8" rx="8" ry="3" fill="#fbbf24"/>
    <rect x="30" y="6" width="4" height="4" fill="#fbbf24"/>
  </g>
  
  <!-- Text "TM" for Technical Institute -->
  <text x="32" y="56" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white" text-anchor="middle">TM</text>
</svg>
